name: Bug Report
description: Report a problem or bug in the Sanity Terraform provider
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide the details below so we can reproduce and fix the issue.

  - type: input
    id: terraform_version
    attributes:
      label: Terraform Version
      description: Run `terraform version` and paste the output.
      placeholder: "e.g. Terraform v1.8.0"
    validations:
      required: true

  - type: input
    id: provider_version
    attributes:
      label: Provider Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Terraform Configuration
      description: Provide the minimal Terraform configuration that triggers the issue.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What happened? Include error output or logs.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
